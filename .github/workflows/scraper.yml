name: Moving Leads Scraper

on:
  schedule:
    # Run every 2 hours at the top of the hour
    - cron: "0 */2 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Set Facebook Cookies from Secret
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
        run: |
          if [ -n "$FB_COOKIES_JSON" ]; then
            echo "$FB_COOKIES_JSON" > cookies.json
            echo "Successfully loaded cookies.json from GitHub Secrets"
          else
            echo "FB_COOKIES_JSON secret is missing! Continuing anyway, but FB might block the login."
          fi

      - name: Run Scraper Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
          INSFORGE_KEY: ${{ secrets.INSFORGE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: "true"
        run: python main.py
